name: Daily Data Update

# Runs every day at 11:30 AM ET (4:30 PM UTC)
# APIPull only rebuilds the gold table if it's been 3+ days since last rebuild
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kenpompy requests databricks-sql-connector pandas pyarrow python-dotenv pytz beautifulsoup4 cloudscraper xgboost scikit-learn numpy

      - name: Refresh KenPom data and rebuild gold table
        timeout-minutes: 20
        env:
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python APIPull.py

      - name: Generate game predictions
        timeout-minutes: 20
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python GamePredictions.py

      - name: Update game results
        timeout-minutes: 20
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python UpdateResults.py

      - name: Retrain ML model and generate predictions
        timeout-minutes: 30
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python TrainModel.py

      - name: Summary
        run: |
          echo "✅ Pipeline complete"
          echo "📊 KenPom data refreshed (gold table rebuilds every 3 days)"
          echo "🎯 Game predictions generated"
          echo "📈 Game results updated"
          echo "🤖 ML model retrained"
