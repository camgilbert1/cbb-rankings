name: Daily Data Update

# Manual runs only (Actions -> Daily Data Update -> Run workflow). The schedule was removed Nov 18 2026:
# GitHub started the 9:11 AM MST cron ('11 16 * * *') 4-8 hours late every day. To bring it back, restore
#   schedule:
#     - cron: '11 16 * * *'
# under "on:" (or trigger workflow_dispatch from an on-time scheduler such as a Databricks job).
# APIPull rebuilds the gold table on every run (falls back to existing tables if KenPom blocks the runner)
on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install kenpompy requests databricks-sql-connector pandas pyarrow python-dotenv pytz beautifulsoup4 cloudscraper xgboost scikit-learn scipy numpy

      # Box-score Parquet files for the v3 model (BoxRatings.py). Past seasons never change, so they are
      # cached between runs; the current season is re-downloaded when the cached copy is > 6 hours old.
      - name: Restore box-score cache
        uses: actions/cache@v4
        with:
          path: box_cache
          key: box-cache-${{ github.run_id }}
          restore-keys: box-cache-

      - name: Refresh KenPom data and rebuild gold table
        timeout-minutes: 20
        env:
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python APIPull.py

      - name: Collect first-half scores (last 3 days)
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python BackfillHalves.py --recent 3

      - name: Snapshot CBBD ratings (SRS, Elo, adjusted) - record only
        timeout-minutes: 5
        continue-on-error: true
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python CBBDRatings.py

      - name: Generate game predictions
        timeout-minutes: 20
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python GamePredictions.py

      - name: Update game results
        timeout-minutes: 20
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python UpdateResults.py

      # v2 (KenPom XGBoost) + v3 (box-score ratings blended with v2). v3 failures only warn.
      - name: Retrain ML models and generate predictions
        timeout-minutes: 40
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python TrainModel.py

      # Kalshi 1H spread/total lines for the 1H tab (display + grading only). Public data, no key.
      # Skips games already started so a pre-tip line is never overwritten with in-game prices.
      - name: Snapshot Kalshi 1H lines - display only
        timeout-minutes: 5
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python KalshiLines.py

      # Static website (site/) -> GitHub Pages. Runs even if an earlier step failed, so the site
      # still refreshes with whatever data is in Databricks.
      - name: Build website data
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python BuildSite.py

      - name: Upload website
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Summary
        run: |
          echo "✅ Pipeline complete"
          echo "📊 KenPom data refreshed"
          echo "🎯 Game predictions generated"
          echo "📈 Game results updated"
          echo "🤖 ML models retrained (v2 KenPom + v3 box-score blend)"

  deploy-site:
    needs: update-data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:              # shared with deploy-site.yml: one Pages deploy at a time
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
